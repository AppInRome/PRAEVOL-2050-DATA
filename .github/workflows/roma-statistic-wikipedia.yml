name: Roma Statistic - Archivio storico Wikipedia
on:
  push:
    branches:
      - roma-statistic-wikipedia-archive
    paths:
      - tools/roma_statistic_wikipedia_download.py
      - .github/workflows/roma-statistic-wikipedia.yml
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Scarica tutte le stagioni Roma 1927-2026
        run: python3 tools/roma_statistic_wikipedia_download.py
      - name: Archivia raccolta scaricabile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roma-statistic-wikipedia-1927-2026
          path: |
            archive/
            ROMA_STATISTIC_WIKIPEDIA_1927_2026.zip
          if-no-files-found: warn
          retention-days: 30
      - name: Salva i risultati nel ramo dedicato
        if: always()
        run: |
          git config user.name "roma-statistic-archive[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add -f archive/ ROMA_STATISTIC_WIKIPEDIA_1927_2026.zip 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Snapshot Wikipedia Roma 1927-2026"
            git push
          fi
